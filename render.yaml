services:
  - type: web
    name: pgmate-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: HYPERSWITCH_API_KEY
        sync: false
      - key: HYPERSWITCH_MERCHANT_ID
        value: pgmate_merchant_india
      - key: HYPERSWITCH_BASE_URL
        value: https://sandbox.hyperswitch.io
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
